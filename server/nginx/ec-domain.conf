# EnglishCommute · **域名**的 80 端口（3.1.0）
#
# ⚠️ 版本化真相源，由 `deploy.sh` 安装。
#
# ## 这个文件只做两件事，而且顺序不能反
#
#   ① 接住 ACME 质询（**必须明文**，这是 Let's Encrypt 的规定）
#   ② 其余的 301 跳 https
#
# ## ⚠️ 为什么 ① 必须在 ② 前面
#
# certbot 续期时是从公网打 `http://YOUR_DOMAIN/.well-known/acme-challenge/<token>` 的。
# 如果这里只有一个「无条件 301」，certbot 跟过去会因为**跟到了自己写的跳转**而拿不到
# 质询文件 —— 症状是：证书到期前 30 天开始每 12 小时续一次、每次都失败，
# 而系统里一切正常（`systemctl list-timers` 显示它在跑）。
# 直到某天证书真的过期，**所有客户端同时失联**。
#
# 这类「定时器在跑但一直在失败」是最难在生产中发现的一种坏法，
# 所以宁可在这里多写三行。
#
# ## 这个 server 块什么时候才装得上
#
# `deploy.sh` 会先看 `/etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem` 在不在：
#
#   证书不在 → 这个文件与 `ec-tls.conf` **都不装**，站点停在「纯 IP」的
#              自洽状态（也就是 3.1.0 之前的样子），而不是半个坏状态。
#   证书在   → 两个都装上。
#
# ⚠️ 那第一次签证书时 ACME 谁来接？—— **default_server**（`ec.conf`）。
#    它的 root 也是 /opt/ec/www、兜底是 `try_files $uri =404`，
#    所以 `/.well-known/acme-challenge/<token>` 天然能被正确服务。
#    这条链路不依赖本文件，因此**没有循环依赖**。

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    root /opt/ec/www;
    charset utf-8;

    # ① ACME 续期质询：不跳转、不缓存、不记日志
    location ^~ /.well-known/acme-challenge/ {
        root /opt/ec/www;
        default_type text/plain;
        access_log off;
        add_header Cache-Control "no-store" always;
    }

    # ② 应用接口：**不在这里跳转**，直接 404（4.0.0）
    #
    # 为什么不跟着走下面那条 301：POST 撞上 301 之后，OkHttp 会**按 RFC 把它
    # 降级成 GET 重试**（不带请求体）⇒ 用户会看到一个「方法不允许」之类的
    # 谜之错误，而真正的原因只是他用了 http。明文上干脆说不提供，更好排查。
    location ^~ /api/ {
        return 404;
    }

    # ② 其余一律跳 https
    #
    # 用 301 而不是 308：这个服务只有 GET（清单 / 字幕 / 音频 / 更新包），
    # 不存在「跳转把方法改掉」的问题，而 301 的兼容面更宽。
    location / {
        return 301 https://$host$request_uri;
    }
}
