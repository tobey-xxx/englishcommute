# EnglishCommute · **HTTPS** 入口（3.1.0）
#
# ⚠️ 版本化真相源，由 `deploy.sh` 安装 —— **但只在证书已经签出来之后才装**
#    （理由见文件末尾「安装条件」）。目录里没有证书时这个文件躺在版本库里不动。
#
# ## 这一份与 ec.conf 的关系
#
# 内容路由**一条都没在这里重写** —— `include` 的是同一份
# `/etc/nginx/snippets/ec-routes.conf`。
#
# 这正是 3.1.0 这一轮在结构上做的唯一一件事：
# 把「哪些资源、什么缓存策略、什么 CORS」从「哪个端口」里拆开。
# 拆开之前，加一个入口就意味着复制一遍 location；复制两遍之后，
# 两边一定会分叉，而分叉的症状（某些资源 443 上 404）会把人引向证书或防火墙。

server {
    # ⚠️ nginx 1.22（Debian 12 自带）用 `listen ... ssl http2;` 这个写法。
    #    `http2 on;` 是 1.25.1 才有的新指令，写在这里会 **nginx -t 直接报错**，
    #    而报错信息指向的是一个「看起来更现代」的写法，很容易让人以为是版本太旧。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;

    # ── 证书 ────────────────────────────────────────────────────────────────
    # 由 `bin/setup-tls.sh` 申请（certbot · webroot 模式 · 不改 nginx 配置）。
    # ⚠️ 刻意**不用** `certbot --nginx`：那会自动改写 /etc/nginx 下的文件，
    #    而这里那些文件是版本管理的 —— certbot 改完之后本地与服务器就分叉了，
    #    下次 deploy.sh 又会覆盖回去，于是「续期能跑但配置在打架」。
    #    webroot 模式只往 /opt/ec/www/.well-known/ 里放一个文件，不碰配置。
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # ── 协议与套件 ──────────────────────────────────────────────────────────
    # 只留 1.2 / 1.3：Android 5 以下才会用到 1.0/1.1，而这个 App 的 minSdk 远高于它。
    ssl_protocols TLSv1.2 TLSv1.3;
    # 交回给客户端选（服务端选会被 BEAST 那类攻击利用，而且 1.3 下这条被忽略）
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    # 会话缓存：客户端每次回到前台都要来一轮同步，跨境链路上省掉一次完整握手是净收益
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ⚠️ 刻意**没有**两样东西，都不是忘了：
    #
    #   ① `add_header Strict-Transport-Security`
    #      HSTS 是**不可逆**的（客户端记住之后再也回不到 http）。而这个服务
    #      没有浏览器用户（唯一客户是 App），OkHttp **不读 HSTS 头** ——
    #      加了收益为零，只在「万一要退回 http」时变成一道自己设的墙。
    #
    #   ② `ssl_stapling on`
    #      OCSP staple 能省掉客户端一次额外请求，但它依赖 nginx 能拉到
    #      Let's Encrypt 的 OCSP 响应。这轮的首要目标是「别把 80 弄坏」，
    #      不值得同时引入一个可能悄悄失败的异步依赖。将来要加强再说。

    root /opt/ec/www;
    charset utf-8;
    autoindex off;
    # 理由与 ec.conf 里那条完全相同：gzip 与 HTTP Range 互斥。
    gzip off;

    include /etc/nginx/snippets/ec-routes.conf;

    # ── 应用接口（4.0.0）─────────────────────────────────────────────────────
    #
    # ⚠️ **这一段只在这一份文件里**，刻意不放进共享的 ec-routes.conf ——
    #    那个 include 同时被两个 80 端口的 server 块用着，写在那里等于让
    #    密码与令牌有机会走明文。**凭证明文过一次就作废了**，
    #    而「反正客户端只用 https」这种假设不该由 nginx 的配置结构来承担。
    #
    # 另外两个入口对 /api/ 的处理（都在这两份文件里显式写着）：
    #   · ec.conf（IP:80，default_server）→ 404，这是应急更新通道，不提供接口
    #   · ec-domain.conf（域名:80）→ 404，免得 POST 被 301 转成 GET 之后
    #     以一种看不懂的方式失败
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # ⚠️ 只信这一条：由**我们自己的** nginx 覆写。`X-Forwarded-For` 是
        #    客户端可以随便伪造的，拿它当来源 IP 等于限速可以绕过。
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 后端是单进程 uvicorn，30 秒足够任何一次同步（正常 < 100ms）
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        # 接口一律不缓存（响应里没有任何可共享的东西，而且带凭证）
        add_header Cache-Control "no-store" always;
    }


    # ⚠️ 与 80 那份**分开记账** —— 这是「IP 例外什么时候能删」的判据来源：
    #    看 IP 那份日志里 /index.json 的请求数，而不是看这里涨了多少。
    access_log /opt/ec/logs/nginx-access-tls.log;
    error_log  /opt/ec/logs/nginx-error.log;
}
