# EnglishCommute · 静态分发（清单 + 字幕 + **音频**）—— **IP 通道**
#
# ⚠️ 这份文件是**版本化的真相源**。服务器上 `/etc/nginx/sites-available/ec`
#    由 `deploy.sh` 从它安装过去 —— 请改这里，不要直接改服务器
#    （两边分叉之后，「本地看着对、线上是旧的」会变成一个查不出来源的问题）。
#
# 2.1.9：加了 `/audio/`。**音频从此由本服务分发**，不再让 App 直连原始 CDN ——
# 原因是实测发现同一个 CDN URL 对不同客户端返回**不同的广告拼接**，
# 于是服务端转写的与手机播放的不是同一份音频，字幕必然错位。
# 详见 bin/cycle.py 文件头的「为什么音频必须托管」。
#
# ============================================================================
# 3.1.0：域名上马了，但这个 server 块**一个字都没改**
# ============================================================================
#
# 新加的域名走 `ec-domain.conf`（80）与 `ec-tls.conf`（443），两条都在
# `sites-enabled/` 里各自独立。**这里仍然是 default_server**，也就是
# 「用 IP 访问时落到的那一份」。
#
# ## 为什么它不能退役（一个先有鸡还是先有蛋的死结）
#
#     App 内更新的清单（/apk/update.json）在服务器上，
#     而**已经装在手机里的 3.0.5 只会去 http://YOUR_SERVER_IP 取它**。
#
#     ⇒ 域名生效 → 新版本才存在 → 但新版本要靠老版本去 IP 上把它拉下来。
#
# 所以 80/IP 一关，所有老客户端**永远升不了级**，而且没有任何补救手段
# （装新包要走 USB）。这条通道的退役条件是**可测量的**，见文件末尾。
#
# 内容路由（location）全部在 `/etc/nginx/snippets/ec-routes.conf` 里 ——
# 80 与 443 共用同一份，避免「80 上能拿到、443 上 404」这类分叉。
# ============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/ec/www;
    charset utf-8;
    autoindex off;

    # ⚠️ 不要开 gzip。（默认就是 off，这里写一句是为了让下一个人别手贱打开。）
    #    gzip 与 HTTP Range 互斥：一旦对 mp3 压缩，播放器的「边播边下 / 拖动进度」
    #    就会失效 —— 而那是音频分发最基本的能力。
    gzip off;

    include /etc/nginx/snippets/ec-routes.conf;

    # ── 应用接口：这条通道上**不提供**（4.0.0）────────────────────────────────
    #
    # 这里是明文通道，唯一职责是「让老客户端能把新版本拉下来」。
    # 账号与令牌**绝不能**从这里过，所以显式拒绝 —— 不靠「反正没有对应文件
    # 所以会 404」那种碰巧正确：将来谁加一条 try_files 之外的规则，
    # 就可能把凭证暴露到公网上。（`/api/` 的反代在 ec-tls.conf 那一份里。）
    location ^~ /api/ {
        return 404;
    }


    # ⚠️ 与 443 那份**分开**记账。这不是洁癖，它是一条判据：
    #
    #     「还有多少客户端在用 IP」= 这个文件里 /index.json 的请求数
    #
    # 等它连续几天归零，才轮到「删掉 network_security_config.xml 里那条 IP 例外」。
    # 合成一个文件之后这个判断就只能靠猜了。
    access_log /opt/ec/logs/nginx-access.log;
    error_log  /opt/ec/logs/nginx-error.log;
}
