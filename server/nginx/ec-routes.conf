# EnglishCommute · 内容路由（**三个 server 块共用同一份**）
#
# ⚠️ 这个文件是**版本化的真相源**。服务器上 `/etc/nginx/snippets/ec-routes.conf`
#    由 `deploy.sh` 从它安装过去 —— 请改这里，不要直接改服务器。
#
# ## 为什么要在 3.1.0 把 location 抽出来
#
# 上了域名之后，同一套内容要在**三个地方**被访问到：
#
#     :80  default_server    老客户端（http://YOUR_SERVER_IP）+ App 内更新的升级通道
#     :80  YOUR_DOMAIN       ACME 续期质询 + 301 跳 https
#     :443 YOUR_DOMAIN       新客户端（https://YOUR_DOMAIN）
#
# 三份复制粘贴的 location 一定会分叉，而分叉的症状是
# 「有些资源在 80 上拿得到、在 443 上 404」—— 排查方向会完全指错
# （第一反应是证书或防火墙，而不是「少写了一个 location」）。
# 抽成一份之后，「两个入口行为一致」变成结构上的事实，不靠人记住。
#
# ⚠️ **`location` 出现在这个文件里的顺序是有意义的**，见下面各条注释。


# ── 健康检查 ────────────────────────────────────────────────────────────────
# 部署后第一件事就是打它。放在最前面只是为了好找。
location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# ── 音频（2.1.9）─────────────────────────────────────────────────────────────
# · `Range` 由 nginx 对静态文件**默认支持**，边播边下靠它，不要加任何 off 指令
# · 缓存设长（音频文件名带内容 id，内容变了就是另一个文件，不存在过期问题）
# · ⚠️ 用 `^~` 前缀匹配而不是正则：mp3 要走 sendfile 快路径，
#   而且 `/audio/` 下将来可能放非 mp3 的东西，正则要漏
location ^~ /audio/ {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=604800, immutable" always;
    add_header Accept-Ranges bytes always;
}

# ── 读音（3.0.0）────────────────────────────────────────────────────────────
# · 每个词的读音约 11 KB，客户端**按需下载后永久存在本地**，
#   所以缓存的价值主要在「重装 / 清数据之后重下」
# · ⚠️ 这里**不能**像 /audio/ 那样写 immutable：
#   读音文件名是 `<lemma>.mp3`，**不带内容版本** —— 一旦某个词的读音
#   重新生成（换音色、修读音错误），immutable 会让已缓存的客户端
#   永远拿到旧的那一份。7 天是折中：省掉绝大部分重复请求，又能自愈。
# · ⚠️ 文件名里可能出现 `.`（`a.m.mp3`）和 `-`（`well-known.mp3`）——
#   所以用**前缀匹配**，不要写正则去猜文件名的形状
location ^~ /pron/ {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=604800" always;
    add_header Accept-Ranges bytes always;
}

# ── App 更新包（2.2.1）───────────────────────────────────────────────────────
# · `update.json` **必须不缓存** —— App 每次回到前台都来问一次。
#   一旦被缓存，客户端会一直看到旧版本号，症状是「我发布了新版，
#   但 App 里永远说已是最新」—— 而服务端看上去一切正常。
# · `.apk` 反过来设长缓存：文件名带版本号，内容变了就是另一个文件名。
# · `Range` 由 nginx 对静态文件**默认支持** —— 断点续传靠它（跨境链路上
#   一次 18 MB 很可能中途断，不能每次从头来）。
location ^~ /apk/ {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=604800, immutable" always;
}

# ⚠️ 精确匹配优先于上面的前缀匹配 —— 顺序在这里不是问题，但**两条都要有**：
#    只写前缀那条的话，update.json 会被一起设成一周缓存。
location = /apk/update.json {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Access-Control-Allow-Origin "*" always;
}

# ── 词表增量（3.0.1）─────────────────────────────────────────────────────────
# 客户端同步时按需拉（实测 141 词 / 13 KB）。
#
# ⚠️ **必须 no-store**：它每次有新素材就会变，而且**文件名不带内容版本**
#    （不像 /audio/ 那样把内容 id 编进文件名）。缓存住之后客户端会一直拿到
#    旧的那份"新词"，还以为自己是最新的 —— 而 `VocabAddSync` 是靠文件里的
#    `version` 字段判断的，那个字段也一起被缓存了，所以**没法自愈**。
location = /vocab/add.json {
    add_header Cache-Control "no-store" always;
    add_header Access-Control-Allow-Origin "*" always;
}

# ── 词表**整包**（3.3.0）─────────────────────────────────────────────────────
#
# 客户端设置页的「更新词库」下这一个包（三个文件一共约 2.4 MB），
# 更新它**不需要**新的 App 版本。
#
# ## 为什么 3.3.0 之前没有它，而现在要有
#
# 词表原来只有两条路：`assets/vocab/*`（跟着 **App 版本**走）和 `add.json`
# （十几 KB 的增量，跟着素材同步走）。中间那一大块没有独立通道 ——
# 于是「把词库更新到最新」这件事用户**做不到**，他能做的最接近的动作是等发版。
#
# ## ⚠️ 路径里带版本号，所以这里可以（也必须）设 immutable
#
# 这正是本文件上面 `/pron/` 那段注释的反面案例：
#
#   · `/pron/` 的文件名是 `<lemma>.mp3`，**不带内容版本** ⇒ 不能 immutable；
#   · 这里是 `table/<version>/vocab.base` —— **内容变了就是换了一个 URL** ⇒
#     可以放心 immutable，省掉每一次的重复下载（2.4 MB 不是小数目）。
#
# 路径里如果不带版本号而设了 immutable，症状是：清单说「有新版本」、
# 客户端也去下载了，拿回来的却是缓存里那份旧的 —— 而且**永远不会自愈**。
location ^~ /vocab/table/ {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=604800, immutable" always;
    add_header Accept-Ranges bytes always;
}

# 词表包的清单。**必须 no-store**（与 `/apk/update.json` 同一条理由）：
# 客户端每次点「更新词库」都先来问它，缓存住就永远看不到新版本号。
location = /vocab/table.json {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Access-Control-Allow-Origin "*" always;
}

# ── /vocab/ 的其余部分：**一律 404**（3.1.0 收口）────────────────────────────
#
# ## 收的是什么
#
# 上面那条精确规则只管 `add.json`，而 `/vocab/` 目录里实际躺着 9 个文件 ——
# 全是服务端**自己的中间产物**：
#
#     vocab.base / vocab.forms            词表全量（~1 MB）
#     vocab.base.published / .forms.published   上一次发布过的快照（产物差集的输入）
#     examples.base                       例句库（~1 MB）
#     vocab.meta.json                     生成参数
#     sample-120.txt / sample-forms.txt / sample-examples.txt   抽样检查用
#
# 它们没有专门规则，于是落到了文件末尾的 `location / { try_files $uri =404; }`
# 上 —— **也就是可以被任何人直接下载**。3.1.0 之前一直如此，只是没人去找。
#
# ## 为什么现在必须收
#
# 一上域名，这个服务就从「一个 IP 上的私人小站」变成了「公网可发现的主机名」。
# 数据本身不算敏感（都是公开播客的词频统计），但有两件事变了性质：
#
#   ① `*.published` 是**发布账本**，能反推出「哪些词还没生成读音」；
#   ② 它们是**可写目标**（root 是这个目录），路径暴露本身就多一类风险面。
#
# 最省事的正解不是「给每个文件写一条 deny」，而是**反过来**：
# 只放行设计上要公开的那一个，其余一律 404。
#
# ⚠️ 用 `return 404` 而**不是** `deny all`：后者回 403，
#    等于告诉扫描的人「这里确实有东西，只是不给你」。
location ^~ /vocab/ {
    return 404;
}

# 句级字幕（Media3 直接拉）
location ~ ^/subs/.+\.srt$ {
    default_type text/plain;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=600" always;
}

# 所有 JSON：词级时间戳（.words.json）与中文译文（.zh.json）
# ⚠️ 必须用一条泛化的 \.json$ 规则 —— 逐个股文件名列举的话，
#    新增一种 JSON（比如这次的 .zh.json）就会**悄悄落到兜底规则上**，
#    被当成 text/plain 发出去。不报错，只是类型不对。
location ~ ^/subs/.+\.json$ {
    default_type application/json;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=600" always;
}

# 清单
location = /index.json {
    default_type application/json;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=300" always;
}

# 兜底（⚠️ 必须留在最后一条）
location / { try_files $uri =404; }
