# 开机加载 BBR 模块（2.2.0）
#
# ⚠️ 这一条不能省。Debian 把 `tcp_bbr` 编译成**模块**而不是内建 ——
#    只写 `net.ipv4.tcp_congestion_control = bbr` 的话，启动时模块还没加载，
#    sysctl 会**静默失败**（掉回 cubic），而 `sysctl --system` 只在 stderr 上
#    抱怨一句，很容易被当成「没问题」。
#
# 实测：`sysctl net.ipv4.tcp_available_congestion_control` 只列出 `reno cubic`
# 就是模块没加载的典型症状；`modprobe tcp_bbr` 之后才会出现 `bbr`。
tcp_bbr
