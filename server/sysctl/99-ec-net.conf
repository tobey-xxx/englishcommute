# 跨境链路的 TCP 调优（2.2.0）
#
# ## 为什么需要它
#
# 真机实测：同一台手机、同一个地址，**挂 VPN 快、直接用移动流量慢**。
# 服务端并没有跑满 —— 从深圳的宽带实测单流能到 3.0 MB/s（≈24 Mbps，已到套餐峰值）。
# 所以瓶颈在**国内运营商到香港的国际出口**这一段：绕路 + 抖动 + 丢包。
#
# 而 Linux 默认的 `cubic` 在这种链路上会很保守 —— 它把丢包一律解释成「网络拥塞」，
# 于是收缩发送窗口。可跨境链路的丢包大多是**随机丢包**（路由抖动、QoS），
# 不是拥塞信号，收缩窗口只是白白浪费带宽。理论吞吐约 `MSS / (RTT · √丢包率)`：
# RTT 40 ms、丢包 1% 时只剩 ~365 KB/s —— 与用户观察到的「很慢」吻合。
#
# ## 做了什么
#
# 1. **BBR**（`congestion_control = bbr`）：不把丢包当拥塞信号，而是持续探测
#    「带宽 × 时延」的积来定发送速率。跨境/移动这类高丢包链路上，它是目前
#    投入产出比最高的一项，通常带来数倍改善。
# 2. **`default_qdisc = fq`**：BBR 的配套队列规则。换成别的会让 BBR 的
#     pacing 失效（它需要按速率给包排程），效果大打折扣。
# 3. **缓冲区**：默认 `rmem_max` / `wmem_max` 只有 **208 KB**，它直接限制单个
#    连接的有效窗口 —— 在 RTT 40 ms 的链路上，窗口不够就等于吞吐上不去。
# 4. **`tcp_slow_start_after_idle = 0`**：移动网络下连接经常被挂起再恢复，
#    默认行为是每次恢复都从慢启动重来（窗口归零）。
# 5. **`tcp_mtu_probing = 1`**：跨境路径上 PMTU 黑洞很常见，不探测会在大包上
#    静默卡死 —— 症状是「连上了、传了一点点、然后停住」。
# 6. **`tcp_notsent_lowat`**：不要一次把数据全塞进队列（配合 BBR 抑制缓冲膨胀）。
#
# ## ⚠️ 这些参数不改变一件事
#
# 它们让**服务端把这条链路用满**，但链路的物理质量仍由运营商路由决定。
# 所以客户端那边还配了**并发分片下载**（把一个大文件拆成几条连接跑）——
# 两根杠杆一起拉，仍然慢的话就是线路本身，只能换线路。

# ---- 拥塞控制：BBR ----
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# ---- 缓冲区（默认 208 KB 太小）----
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# ---- 长肥管道 / 移动网络友好 ----
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_notsent_lowat = 131072

# ---- 连接队列：突发请求（几十台手机同时上线）不要被丢弃 ----
net.core.somaxconn = 1024
net.ipv4.tcp_max_syn_backlog = 2048
