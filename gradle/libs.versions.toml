# ⚠️ 版本选择说明（已实测，不要随手升到最新）
#
# 真机 SDK 组合：AGP 8.13.2 + compileSdk 36 + build-tools 36.1.0 + Gradle 8.14.3 + JDK 17
#
# 各库的「最新版」中，有一批已经要求 compileSdk 37 + AGP 9.1.0，
# 在本组合下会直接构建失败。下面每个版本号都已通过读取其 AAR 里的
# `aar-metadata.properties`（minCompileSdk / minAndroidGradlePluginVersion）核对过：
#
#   core-ktx 1.19.0            → minCompileSdk 37 / minAGP 9.1.0  ✗ 不可用
#   lifecycle 2.11.0           → minCompileSdk 37 / minAGP 9.1.0  ✗ 不可用
#   compose ui 1.12.x          → minCompileSdk 37 / minAGP 9.1.0  ✗ 不可用
#   navigation-compose 2.10.1  → minCompileSdk 37 / minAGP 9.1.0  ✗ 不可用
#
# 以后要升级：先按同样方式查 AAR 元数据，确认 minCompileSdk ≤ 36 且 minAGP ≤ 8.13.2。

[versions]
agp = "8.13.2"
kotlin = "2.2.21"

coreKtx = "1.18.0"          # 1.19.0 需 compileSdk 37
activityCompose = "1.13.0"
lifecycle = "2.10.0"        # 2.11.0 需 compileSdk 37
navigation = "2.9.5"        # 2.10.1 需 compileSdk 37
work = "2.11.2"
datastore = "1.2.1"
media3 = "1.11.1"
composeBom = "2026.06.01"   # ui 1.11.4 / material3 1.4.0；2026.08.00 起 ui 需 compileSdk 37
okhttp = "4.12.0"
coroutines = "1.11.0"

# JVM 单元测试用（`app/src/test/`，跑在开发机上、不进 APK）。
#
# 为什么这个项目需要它：FSRS 调度器（word/Fsrs.kt）是从官方 Python 实现**移植**的，
# 移植的正确性只有一条路能证明 —— 逐值比对。`tools/fsrs-reference` 放着官方只读副本，
# `tools/gen-fsrs-vectors.py` 用它生成期望值，`FsrsTest.kt` 逐值对。
# 光靠肉眼看公式，一个下标写错（`parameters[9]` 写成 `parameters[10]`）
# 在代码里是完全对称、看着很对的一行。
#
# JUnit 4 而不是 5：只是最朴素的「跑一个方法、断言一个数」，不需要引擎那套东西。
junit = "4.13.2"

# ⚠️ 这个依赖不能省：Android 的 `org.json` 在 JVM 单元测试里是**空壳**
#    （android.jar 里的方法体全是 `throw new RuntimeException("Stub!")`），
#    而 `WordStore` 的落盘/加载全靠它。不补一个真实实现，
#    「生词本能不能存下来」这件事在单测里根本验不了。
#    ⚠️ 注意它**只在 testImplementation 里**，APK 里用的是系统自带的那份。
json = "20240303"

# 端侧翻译的推理运行时。
#
# ⚠️ 版本必须与 sherpa-onnx 自带的那份 libonnxruntime **在符号版本层面兼容**，
# 光「同 minor」是不够的 —— 这条注释以前写的是「同 minor 意味着 OrtApi 函数指针表
# 结构一致，所以可以互换」，那个判断在 0.9.1 被真机闪退证伪了：
#
#   sherpa 1.13.8 自带 ORT 1.28.2，它的 .so 重定位表里带符号**版本**引用
#       libsherpa-onnx-jni.so  需要  OrtGetApiBase@VERS_1.28.2
#   而官方 1.28.0 只定义了
#       libonnxruntime.so           OrtGetApiBase@@VERS_1.28.0
#   → bionic linker 校验版本名失败，报「找不到符号」，真机 dlopen 直接炸。
#   （函数指针表结构确实一致，但重定位表里的版本名不一致。）
#
# 另外 Maven 上**没有 1.28.2**（1.28.0 直接跳 1.29.0），所以「升版本对齐」走不通。
# 现方案：由 tools/vendor-sherpa-aar.sh 裁掉 sherpa 自带的那份，
# 并用 tools/patch-ort-symbol-version.py 把 sherpa 库里对 ORT 的版本需求
# 改写成这里这个版本实际定义的名字。
#
# ⚠️ 因此：**改这个版本号之后必须重跑 `FORCE=1 ./tools/vendor-sherpa-aar.sh`**，
#    否则版本需求又会指向一个不存在的版本名。
#    build-apk.sh 的断言 6 会拦住漏跑的情况。
#
# AAR 里 arm64-v8a 的 libonnxruntime.so / libonnxruntime4j_jni.so 实测
# p_align=0x4000（16KB 对齐），满足 Android 15+ 的强制要求。
onnxruntime = "1.28.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
androidx-media3-ui-compose = { group = "androidx.media3", name = "media3-ui-compose", version.ref = "media3" }
androidx-media3-extractor = { group = "androidx.media3", name = "media3-extractor", version.ref = "media3" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
json = { group = "org.json", name = "json", version.ref = "json" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

onnxruntime-android = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android", version.ref = "onnxruntime" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
